[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhound"
version = "0.2.0"
description = "A fast, local pre-commit secret scanner powered by entropy and regex."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["security", "secrets", "pre-commit", "devsecops"]
dependencies = [
    "rich>=12.0.0"
]

[project.scripts]
leakhound = "leakhound.cli:main"

[project.urls]
Repository = "https://github.com/HizbullahS/leakhound"
Issues = "https://github.com/HizbullahS/leakhound/issues"

[tool.setuptools.packages.find]
include = ["leakhound*"]
exclude = ["tests*"]
