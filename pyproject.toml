[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhound"
version = "0.1.0"
description = "A fast, local pre-commit secret scanner powered by entropy and regex."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=12.0.0"
]

[project.scripts]
leakhound = "leakhound.cli:main"
